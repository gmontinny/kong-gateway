_format_version: "2.1"
_transform: true

services:
  - name: mtdash-api
    url: http://minha-api.homolog.exemplo.com.br
    plugins:
      - name: rate-limiting
        config:
          minute: 120
          hour: 2000
          policy: local
      - name: cors
        config:
          origins:
            - "http://minha-api.homolog.exemplo.com.br"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
            - X-API-Key
          credentials: true
    routes:
      - name: mtdash-rota
        paths:
          - /
        strip_path: false
